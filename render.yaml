services:
  - type: web
    name: lawmedy-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "4000"
      - key: WEB_ORIGIN
        value: https://www.lawmedy.in,https://lawmedy.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Tried in order if the main model is overloaded or over quota.
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash
      - key: LEGAL_NOTICE_PRICE_PAISE
        value: "29900"
      - key: RTI_PRICE_PAISE
        value: "29900"
      - key: EVIDENCE_MAX_BYTES
        value: "10485760"
      - key: PAYMENT_MODE
        value: manual
      - key: PAYMENT_LINK_URL
        value: https://razorpay.me/@aawasyojana
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      # Set these in the Render dashboard (never commit them):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional extra AI provider used only when Gemini is unavailable:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # File storage: set STORAGE_DRIVER=supabase together with the two keys below.
      - key: STORAGE_DRIVER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
